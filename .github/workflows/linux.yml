name: linux

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Linux x64 packages and Electron smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install git and desktop libraries
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libatspi2.0-0 libsecret-1-0 libasound2 libgbm1 xvfb python3-gi gir1.2-gtk-3.0
          git --version

      # dist:linux installs development Electron too: packaging includes its license files.
      - run: npm ci
      - run: npm run dist:linux -- --publish never

      - name: Inspect the Debian package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --field dist/*.deb Depends | grep -F 'git (>= 1:2.51.0)'

      # Resolve the installed icon through GTK, not just by checking that a PNG exists:
      # hicolor ignores sizes missing from index.theme (including a lone 1024px PNG).
      - name: Check launcher icon lookup
        run: |
          dpkg-deb --extract dist/*.deb "$RUNNER_TEMP/pasta-deb"
          /usr/bin/python3 - <<'PY'
          import os
          from pathlib import Path
          import gi
          gi.require_version('Gtk', '3.0')
          from gi.repository import Gtk
          icons = Path(os.environ['RUNNER_TEMP']) / 'pasta-deb/usr/share/icons'
          theme = Gtk.IconTheme.new()
          theme.set_search_path([str(icons), '/usr/share/icons'])
          theme.set_custom_theme('hicolor')
          for size in (16, 32, 48, 64, 128, 256, 512):
              icon = theme.lookup_icon('pasta-lite', size, 0)
              assert icon, f'Launcher icon missing at size {size}'
              resolved = Path(icon.get_filename())
              assert icons in resolved.parents, f'Unexpected icon: {resolved}'
              print(f'{size}px: {resolved}')
          PY

      # Development Electron enables the smoke harness while loading the packaged application.
      # It uses disposable user data, and the demo never touches a user's repositories.
      - name: Smoke-test the packaged app
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
        run: |
          node scripts/demo-repo.js "$RUNNER_TEMP/pasta-demo"
          xvfb-run -a node_modules/.bin/electron dist/linux-unpacked/resources/app.asar --smoke "$RUNNER_TEMP/linux-start.png"
          PL_SMOKE_WATCH=1 xvfb-run -a node_modules/.bin/electron dist/linux-unpacked/resources/app.asar --smoke "$RUNNER_TEMP/pasta-demo" "$RUNNER_TEMP/linux-repo.png"

      - name: Checksums
        working-directory: dist
        run: |
          version=$(node -p "require('../package.json').version")
          files=(Pasta-Lite-*-linux-x86_64.AppImage Pasta-Lite-*-linux-amd64.deb)
          test "${#files[@]}" -eq 2
          sha256sum "${files[@]}" > "Pasta-Lite-$version-SHA256SUMS-linux.txt"
          sha256sum -c "Pasta-Lite-$version-SHA256SUMS-linux.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/Pasta-Lite-*-linux-x86_64.AppImage
            dist/Pasta-Lite-*-linux-amd64.deb
            dist/Pasta-Lite-*-SHA256SUMS-linux.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-smoke
          path: ${{ runner.temp }}/linux-*.png
          if-no-files-found: ignore
