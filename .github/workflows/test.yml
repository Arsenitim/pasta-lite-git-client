name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Node 22 (the oldest supported, package.json engines) on both OSes, and the current LTS,
      # Node 24, once on Ubuntu: three runs instead of four, since the platform-specific code
      # (watcher, paths, git discovery) doesn't depend on the Node major.
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    env:
      # npm test never starts Electron (the tests load src/ and renderer/ under plain Node),
      # so skip the Electron binary download in npm ci.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      # Actions are pinned to a commit (a tag can be moved); the comment names its release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The app and its tests need git >= 2.51 (src/gitcheck.js); the runner images ship older ones.
      - name: Install git (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo add-apt-repository -y ppa:git-core/ppa && sudo apt-get update && sudo apt-get install -y git

      - name: Install git (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install git
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: git version
        run: |
          command -v git
          git --version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          # The newest patch release of that major, not the runner image's cached one: Node security
          # fixes ship as patch releases.
          check-latest: true
          cache: npm

      - run: npm ci

      # The tests set their own git identity and ignore the global config (test/helpers.js).
      - run: npm test

      # Lint once (the pinned ESLint from devDependencies; it doesn't depend on the OS).
      - if: matrix.node == 24
        run: npm run lint

  # Windows: the whole suite against Git for Windows. git runs the interactive-rebase editor
  # (src/rebase-editor.js, plain sh commands) and the tests' hooks and filters through its own sh,
  # with the git dir passed as C:/... (src/rebase.js helperEnv).
  test-windows:
    name: test (windows-latest, Node 22)
    runs-on: windows-latest
    # The full suite takes about 7 minutes on a Windows runner (some 12 minutes of tests, three
    # files at a time), against a few on macOS/Linux: 45 leaves room for slower runners. A hung
    # test fails its file (--test-timeout below) instead of using up the job's budget.
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      # The checkout has LF line endings as on macOS/Linux although Git for Windows' system config
      # sets core.autocrlf=true: .gitattributes (eol=lf) overrides it. The tests' own repos ignore
      # the system and global config (test/helpers.js).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # The newest patch release of that major, not the runner image's cached one: Node security
          # fixes ship as patch releases.
          check-latest: true
          cache: npm

      # The runner image's Git for Windows is new enough (git >= 2.51, src/gitcheck.js); fail
      # early, through the app's own check of the git on PATH, if an image update ever changes that.
      - name: git version
        run: |
          (Get-Command git).Source
          (Get-Command sh).Source
          git --version
          node -e "require('./src/gitcheck').checkGit().then((r) => { console.log(r); process.exit(r.ok ? 0 : 1); })"

      - run: npm ci

      # The full suite (npm test's glob, quoted: node expands it, not PowerShell). What can't run
      # on Windows is skipped there with a reason: #!/bin/sh fakes of git, POSIX signals, the
      # executable bit, names Windows forbids. The tests that cancel git during a hook run here
      # too: cancelling is taskkill /T /F plus a kill of the hook's MSYS processes there
      # (src/git-process.js signalGroup).
      # Each test file runs in its own process, and --test-timeout bounds each file's whole run
      # (waiting for its process to exit included), not each test in it: on Node 22 a file's own
      # tests get no timeout from it. So it is a hang guard per file, well above the slowest file
      # (git.test.js and rebase-interactive.test.js take three to four minutes here): a hung test
      # fails its file, and the job goes on. --test-force-exit ends a file whose test left a
      # handle open, so a leaked handle can't hold its file to the timeout (the step below looks
      # for the watcher's).
      - name: Tests
        run: node --test --test-timeout=600000 --test-force-exit "test/*.test.js"

      # The watcher's tests again, without --test-force-exit: a watch one of them leaves open keeps
      # the file's process from exiting, and the file then fails at --test-timeout (the step's
      # timeout is the backstop) instead of the full run hiding it. The file takes well under that.
      - name: Watcher tests leave no watch open
        timeout-minutes: 5
        run: node --test --test-timeout=120000 test/watcher.test.js
